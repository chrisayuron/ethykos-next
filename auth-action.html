<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar cuenta | Éthykos Next</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#1d2939}.card{width:min(90%,440px);background:#fff;padding:34px;border-radius:18px;box-shadow:0 20px 60px #1d29391a}h1{font-size:24px;margin:0 0 12px}p{color:#667085;line-height:1.6}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;margin-top:10px;font-size:14px}input{border:1px solid #d0d5dd}button{border:0;background:#2563eb;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.msg{margin-top:14px;font-size:13px}</style></head><body><main class="card"><h1 id="title">Activar cuenta</h1><p id="description">Estamos verificando el enlace…</p><form id="passwordForm" hidden><label for="password">Nueva contraseña</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres"><label for="confirm">Confirma la contraseña</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Repite la contraseña"><button id="save" type="submit">Guardar contraseña</button></form><div class="msg" id="msg" role="status"></div><p><a href="/login">Ir al inicio de sesión</a></p></main><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script>const config={apiKey:'AIzaSyDOHT0woQTBqAs7N6P_SjorXUDBzqchX6E',authDomain:'ethykos-next.firebaseapp.com',projectId:'ethykos-next'};firebase.initializeApp(config);const auth=firebase.auth(),q=new URLSearchParams(location.search),mode=q.get('mode'),oobCode=q.get('oobCode'),$=id=>document.getElementById(id);function status(t){$('msg').textContent=t} (async()=>{try{if(!oobCode)throw Error('El enlace está incompleto o no es válido.');if(mode==='verifyEmail'){await auth.applyActionCode(oobCode);$('title').textContent='Correo confirmado';$('description').textContent='Tu dirección de correo quedó verificada. Ahora puedes establecer tu contraseña desde el segundo enlace del mensaje de invitación.';status('Verificación completada.');}else if(mode==='resetPassword'){const email=await auth.verifyPasswordResetCode(oobCode);$('description').textContent='Establece una contraseña personal para '+email+'.';$('passwordForm').hidden=false;}else throw Error('Este enlace no corresponde a una acción reconocida.');}catch(e){console.error('[V4.12 auth-action]',e.code||e.message);$('title').textContent='No se pudo completar la acción';$('description').textContent='El enlace puede haber vencido o ya fue utilizado. Solicita una nueva invitación al administrador.';status('Por seguridad, no compartimos detalles de este enlace.');}})();$('passwordForm').onsubmit=async e=>{e.preventDefault();const a=$('password').value,b=$('confirm').value;if(a.length<8||a!==b){status('Verifica que ambas contraseñas coincidan y tengan al menos 8 caracteres.');return;}$('save').disabled=true;try{await auth.confirmPasswordReset(oobCode,a);$('passwordForm').hidden=true;$('title').textContent='Contraseña establecida';$('description').textContent='Tu contraseña se guardó correctamente. Ya puedes ingresar a Éthykos Next.';status('Proceso completado.');}catch(e){console.error('[V4.12 password-reset]',e.code||e.message);status('No fue posible guardar la contraseña. Solicita un nuevo enlace al administrador.');$('save').disabled=false;}};</script></body></html>
