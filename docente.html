<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espacio docente | Éthykos Next</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#1d2939;font-family:Inter,sans-serif}.top{background:#fff;border-bottom:1px solid #e4eaf2;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#1d2939}.btn{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.wrap{max-width:980px;margin:48px auto;padding:0 20px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#168b69}.card{margin-top:20px;padding:26px;background:#fff;border:1px solid #e4eaf2;border-radius:18px;box-shadow:0 14px 35px #1d29390c}h1{font-size:34px;margin:10px 0}p{color:#667085;line-height:1.7}.status{padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8}</style></head><body><header class="top"><div class="brand">✦ ÉTHYKOS NEXT</div><button class="btn" id="logout">Cerrar sesión</button></header><main class="wrap"><div class="eyebrow">ESPACIO DOCENTE</div><h1>Bienvenido a tu espacio.</h1><p>Desde aquí podrás acompañar a tus grupos y desarrollar experiencias de aprendizaje.</p><section class="card"><strong id="teacherName">Comprobando tu cuenta…</strong><p id="institutionName">Validando institución y permisos.</p><div class="status" id="status">Un momento, por favor.</div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyDOHT0woQTBqAs7N6P_SjorXUDBzqchX6E",authDomain:"ethykos-next.firebaseapp.com",databaseURL:"https://ethykos-next-default-rtdb.firebaseio.com",projectId:"ethykos-next",storageBucket:"ethykos-next.firebasestorage.app",messagingSenderId:"115810507249",appId:"1:115810507249:web:19c4d586fb681de1764c50"};
console.info('[Éthykos Next] V4.21.0 — acceso docente ligado a grupo y año activo.');
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');
let membershipRef=null,membershipListener=null,yearRef=null,yearListener=null,accessRevoked=false;
function revokeTeacherAccess(reason){if(accessRevoked)return;accessRevoked=true;document.getElementById('status').textContent=reason||'Tu acceso académico ha finalizado. Comunícate con el administrador.';document.getElementById('status').style.background='#fff1f0';document.getElementById('status').style.color='#b42318';if(membershipRef&&membershipListener)membershipRef.off('value',membershipListener);if(yearRef&&yearListener)yearRef.off('value',yearListener);setTimeout(()=>auth.signOut().finally(()=>{sessionStorage.removeItem('ethykosInstitutionId');location.replace('login.html?error=revoked');}),1800);}
auth.onAuthStateChanged(async user=>{
 if(!user){location.replace('login.html');return;}
 try{
  await user.reload();if(!user.emailVerified)throw new Error('La cuenta no está habilitada.');
  const token=await user.getIdToken(true),response=await fetch('/api/institutions/context',{headers:{Authorization:`Bearer ${token}`}}),data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.message||'No se pudo validar tu asignación docente.');
  const wanted=sessionStorage.getItem('ethykosInstitutionId'),selected=(data.institutions||[]).find(x=>x.role==='teacher'&&(!wanted||wanted===x.institutionId));
  if(!selected)throw new Error('No tienes grupos de Ética asignados en un año lectivo activo. Comunícate con el administrador.');
  const id=selected.institutionId,yearId=selected.institution.academicYear;sessionStorage.setItem('ethykosInstitutionId',id);
  yearRef=db.ref(`academicYears/${id}/${yearId}/profile`);yearListener=s=>{const y=s.val();if(!y||y.status!=='active')revokeTeacherAccess('El año lectivo ha sido cerrado. Tu acceso académico terminó.');};yearRef.on('value',yearListener,()=>revokeTeacherAccess('El año lectivo dejó de estar disponible. Tu acceso académico terminó.'));
  membershipRef=db.ref(`memberships/${user.uid}/${id}`);membershipListener=s=>{const m=s.val();if(!m||m.status!=='active'||m.role!=='teacher')revokeTeacherAccess('Tu acceso a esta institución ha sido desactivado.');};membershipRef.on('value',membershipListener);
  const profile=(await db.ref(`users/${user.uid}/profile`).once('value')).val()||{};document.getElementById('teacherName').textContent=profile.displayName||user.email;document.getElementById('institutionName').textContent=selected.institution.name;document.getElementById('status').textContent='Acceso docente validado. Tienes grupos asignados para el año lectivo '+yearId+'.';
 }catch(e){document.getElementById('status').textContent=e.message;setTimeout(()=>auth.signOut().then(()=>location.href='login.html'),2500);}
});
</script></body></html>
