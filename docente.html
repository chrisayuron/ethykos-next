<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espacio docente | Éthykos Next</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#1d2939;font-family:Inter,sans-serif}.top{background:#fff;border-bottom:1px solid #e4eaf2;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#1d2939}.btn{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.wrap{max-width:980px;margin:48px auto;padding:0 20px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#168b69}.card{margin-top:20px;padding:26px;background:#fff;border:1px solid #e4eaf2;border-radius:18px;box-shadow:0 14px 35px #1d29390c}h1{font-size:34px;margin:10px 0}p{color:#667085;line-height:1.7}.status{padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8}</style></head><body><header class="top"><div class="brand">✦ ÉTHYKOS NEXT</div><button class="btn" id="logout">Cerrar sesión</button></header><main class="wrap"><div class="eyebrow">ESPACIO DOCENTE</div><h1>Bienvenido a tu espacio.</h1><p>Desde aquí podrás acompañar a tus grupos y desarrollar experiencias de aprendizaje.</p><section class="card"><strong id="teacherName">Comprobando tu cuenta…</strong><p id="institutionName">Validando institución y permisos.</p><div class="status" id="status">Un momento, por favor.</div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyDOHT0woQTBqAs7N6P_SjorXUDBzqchX6E",authDomain:"ethykos-next.firebaseapp.com",databaseURL:"https://ethykos-next-default-rtdb.firebaseio.com",projectId:"ethykos-next",storageBucket:"ethykos-next.firebasestorage.app",messagingSenderId:"115810507249",appId:"1:115810507249:web:19c4d586fb681de1764c50"};console.info('[Éthykos Next] V4.11 — control de membresía y revocación de acceso.');const ADMIN_UID='8mheoQqcekSQkpK5S8qTonUWKt83';firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');let membershipRef=null;let membershipListener=null;let accessRevoked=false;
function revokeTeacherAccess(reason){if(accessRevoked)return;accessRevoked=true;document.getElementById('status').textContent=reason||'Tu acceso a esta institución ha sido desactivado. Comunícate con el administrador.';document.getElementById('status').style.background='#fff1f0';document.getElementById('status').style.color='#b42318';if(membershipRef&&membershipListener)membershipRef.off('value',membershipListener);setTimeout(()=>auth.signOut().finally(()=>{sessionStorage.removeItem('ethykosInstitutionId');location.replace('login.html?error=revoked');}),2500);}
auth.onAuthStateChanged(async user=>{if(!user){location.href='login.html';return;}try{await user.reload();if(!user.emailVerified)throw new Error('Debes verificar tu correo.');const snap=await db.ref(`memberships/${user.uid}`).once('value');const memberships=snap.val()||{};const id=sessionStorage.getItem('ethykosInstitutionId');let selected=null;for(const [institutionId,m] of Object.entries(memberships)){if(m.status==='active'&&m.role==='teacher'&&(!id||id===institutionId)){const is=await db.ref(`institutions/${institutionId}/profile`).once('value');const iv=is.val();if(iv?.status==='active'){selected={id:institutionId,name:iv.name};break;}}}if(!selected)throw new Error('Tu acceso a esta institución no está activo. Comunícate con el administrador.');sessionStorage.setItem('ethykosInstitutionId',selected.id);membershipRef=db.ref(`memberships/${user.uid}/${selected.id}`);membershipListener=s=>{const m=s.val();if(!m||m.status!=='active'||m.role!=='teacher')revokeTeacherAccess('Tu acceso a esta institución ha sido desactivado. Comunícate con el administrador.');};membershipRef.on('value',membershipListener);const profile=(await db.ref(`users/${user.uid}/profile`).once('value')).val()||{};document.getElementById('teacherName').textContent=profile.displayName||user.email;document.getElementById('institutionName').textContent=selected.name;document.getElementById('status').textContent='Acceso docente validado. Este panel inicial se ampliará con grupos, actividades y seguimiento.';}catch(e){document.getElementById('status').textContent=e.message;setTimeout(()=>auth.signOut().then(()=>location.href='login.html'),2500);}});</script></body></html>
